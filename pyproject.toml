[tool.poetry]
name = "agrilink"
version = "0.1.0"
description = "Real-time, sensor-less agricultural intelligence platform powered by RAG-grounded multi-agent AI"
authors = ["AgriLink Team"]
readme = "README.md"
packages = [{include = "agrilink", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-socketio = "^5.11.0"
python-multipart = "^0.0.6"

# LangChain ecosystem
langchain = "^0.1.0"
langchain-openai = "^0.0.5"
langchain-anthropic = "^0.1.0"
langchain-community = "^0.0.20"
langchain-core = "^0.1.20"

# Vector stores
chromadb = "^0.4.22"
pinecone-client = "^3.0.0"
faiss-cpu = "^1.7.4"

# Database
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
alembic = "^1.13.1"

# Redis
redis = {extras = ["hiredis"], version = "^5.0.1"}
aioredis = "^2.0.1"

# Data validation
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"

# HTTP clients
httpx = "^0.26.0"
aiohttp = "^3.9.1"

# Utilities
python-dotenv = "^1.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
tenacity = "^8.2.3"
tiktoken = "^0.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^24.1.1"
ruff = "^0.1.14"
mypy = "^1.8.0"
ipython = "^8.20.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
