version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: agrilink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: agrilink-postgres
    environment:
      POSTGRES_DB: agrilink
      POSTGRES_USER: agrilink
      POSTGRES_PASSWORD: agrilink_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrilink"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Chroma vector database (can also run embedded)
  # chroma:
  #   image: chromadb/chroma:latest
  #   container_name: agrilink-chroma
  #   ports:
  #     - "8001:8000"
  #   volumes:
  #     - chroma_data:/chroma/chroma
  #   environment:
  #     - IS_PERSISTENT=TRUE

volumes:
  redis_data:
  postgres_data:
  # chroma_data:
